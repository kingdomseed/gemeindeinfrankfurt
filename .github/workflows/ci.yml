name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npx oxlint --deny-warnings --format github
      - name: Test
        run: npm test
      - name: React Doctor
        run: npm run doctor
      - name: Build
        run: npm run build
