# Git hooks, installed by `npm install` (the `prepare` script runs `lefthook install`).
# Skip once with LEFTHOOK=0 git commit ... only when you have a reason to.

pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,json,jsonc,md,css,yml,yaml}"
      run: npx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: typegen
      glob: "*.{ts,tsx}"
      run: npx next typegen
    - name: lint
      glob: "*.{ts,tsx,js,mjs}"
      run: npx oxlint --deny-warnings {staged_files}
    - name: react-doctor
      glob: "*.{ts,tsx,js,jsx}"
      run: npx react-doctor --staged --no-telemetry --blocking warning

pre-push:
  jobs:
    - name: check
      run: npm run check
